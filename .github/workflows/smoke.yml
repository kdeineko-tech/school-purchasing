# Smoke: прод після кожного деплою main і щодня (D0) + кожен НЕпродовий деплой Vercel (preview з PR і гілка staging)
# за адресою саме цього деплою, з обходом захисту Vercel (WS11, трек A). Обидва jobs при збої шлють алерт у Telegram
# (WS11, трек B; без секретів Telegram — попередження, smoke однаково червоний).
# Скрипт — scripts/smoke.mjs; локально: npm run smoke -- <URL> [sha]. Лише GET, без входу.
# Секрети (Settings → Secrets and variables → Actions → Secrets; лише назви, значень у git немає):
#   VERCEL_AUTOMATION_BYPASS_SECRET — Vercel → Settings → Deployment Protection → Protection Bypass for Automation;
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — бот і чат для алертів.
# Змінна репо (не секрет): PROD_URL = https://<проєкт>.vercel.app. Без неї прод-job червоний з підказкою: адресу за
# замовчуванням не беремо, щоб smoke ніколи не перевіряв чужий прод.
# Джерело: шаблон курсу 2026-quitcode-11-devops-operations-hw/materials/ops-kit (smoke v2) поверх власного D0 (WS8).
# Власні доповнення: ручний прод-запуск лише з main; у scripts/smoke.mjs — тайм-аут запиту, редірект "/" лише на
# /login того самого застосунку, будь-який код "/" крім 200 і 3xx на /login — збій.
# Це НЕ обов'язкова перевірка ruleset-у. Події repository_dispatch і schedule GitHub запускає ЛИШЕ з файлу на
# main: до merge — лише локально (npm run smoke) або Run workflow з main після merge (поле url → job deploy).
# Захист Vercel: якщо вмикаєте Vercel Authentication — Standard Protection (прод відкритий: D0 і перевірка курсу
# читають прод без входу), не All Deployments. Після перегенерації секрету обходу — оновити секрет у GitHub і Redeploy.
name: smoke

on:
  # Подію status (commit status «Vercel» = success) прибрано після дрилу 2026-11-28
  # (docs/incidents/2026-11-28-staging-publishable-key.md): у github.event.branches GitHub кладе ВСІ гілки, що містять
  # коміт, тож деплой staging на коміті, який уже є в історії main, запускав job prod і хибний алерт «прод показує
  # інший коміт». Прод після деплою ловить repository_dispatch з environment == production.
  # Vercel шле repository_dispatch після кожного деплою: production → job "prod", усе інше (preview, staging) → "deploy".
  repository_dispatch:
    types: [vercel.deployment.success]
  schedule:
    - cron: "23 5 * * *" # щодня ≈ 07:23 за Києвом (зимовий час): прод живий, прод-база не «заснула»; GitHub може запустити на години пізніше
  workflow_dispatch:
    inputs:
      url:
        description: "Адреса деплою для job deploy (порожньо = прод з PROD_URL). Навмисно червоний прогін: https://example.invalid"
        required: false
        default: ""
      sha:
        description: "Очікуваний коміт на цій адресі (необов'язково)"
        required: false
        default: ""

permissions:
  contents: read

# Ключ групи містить id деплою: staging після fast-forward має той самий коміт, що й прод, і без id їхні прогони
# потрапили б в одну групу. Без cancel-in-progress: прогін може чекати перемикання прод-домену (до 6 × 20 с).
concurrency:
  group: smoke-${{ github.event_name }}-${{ github.event.context || 'na' }}-${{ github.event.client_payload.id || github.event.client_payload.git.sha || github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prod:
    # Розклад, ручний запуск без url (лише з main: з іншої гілки github.sha не збігся б із продом — прогін пропущено,
    # а не червоний) і production-подія Vercel. Лише ці три: tests/smoke-workflow.test.ts падає, якщо сюди повернеться
    # подія status чи github.event.branches (хибний прод-алерт від деплою staging, дріл 2026-11-28).
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.url == '' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      # Очікуваний коміт: щойно розгорнутий (repository_dispatch) або HEAD main (schedule, ручний запуск з main).
      EXPECT_SHA: ${{ github.event.client_payload.git.sha || github.event.sha || github.sha }}
      # Прод не за захистом (Standard Protection), але заголовок не шкодить, якщо колись увімкнуть All Deployments.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Змінна PROD_URL задана
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error title=smoke::Немає змінної репо PROD_URL — Settings → Secrets and variables → Actions → Variables → PROD_URL = https://<проєкт>.vercel.app"
            exit 1
          fi
      # Як у job deploy: production-подія Vercel без коміту деплою — явний збій, а не тихе порівняння проду з HEAD main
      # (EXPECT_SHA тоді впав би на github.sha і міг дати хибну тривогу). Розклад і ручний запуск звіряють з HEAD main.
      - name: Коміт деплою передано
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          if [ -z "$PAYLOAD_SHA" ]; then
            echo "::error title=smoke::Подія deployment.success без client_payload.git.sha — коміт прод-деплою не можна звірити"
            exit 1
          fi
      - name: Прод = main, сторінка входу відкривається, база відповідає
        run: node scripts/smoke.mjs "$PROD_URL" "$EXPECT_SHA"
      - name: Алерт людині в Telegram (лише якщо щось червоне)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ENV: production
          ALERT_URL: ${{ env.PROD_URL }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_JOB: ${{ github.job }}
          ALERT_SHA: ${{ github.event.client_payload.git.sha || github.event.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Без set -x і без curl -v: токен бота стоїть в адресі запиту. Значення секретів не друкуємо ніде.
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning title=alert::Немає секретів TELEGRAM_BOT_TOKEN і/або TELEGRAM_CHAT_ID — алерт пропущено (smoke однаково червоний)."
            exit 0
          fi
          host=$(printf '%s' "$ALERT_URL" | sed -E 's#^[A-Za-z]+://##; s#/.*$##')
          text=$(printf 'ЧЕРВОНИЙ SMOKE\nРепо: %s\nWorkflow: %s, job: %s\nСередовище: %s\nАдреса: %s\nКоміт: %s\nПрогін: %s' \
            "$GITHUB_REPOSITORY" "$ALERT_WORKFLOW" "$ALERT_JOB" "$ALERT_ENV" "${host:-не задано}" "${ALERT_SHA:0:7}" "$RUN_URL")
          if curl -sS --fail --max-time 15 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" 2>/dev/null; then
            echo "Алерт надіслано в Telegram."
          else
            echo "::warning title=alert::Telegram не прийняв повідомлення — перевірте токен бота, chat id і чи бот доданий у чат."
          fi

  deploy:
    # НОВЕ у WS11: кожен НЕпродовий деплой (preview з PR і гілка staging) — за адресою саме цього деплою
    # (client_payload.url), а не за фіксованою адресою проду. Ручний запуск з полем url — теж сюди.
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment != 'production') ||
      (github.event_name == 'workflow_dispatch' && inputs.url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
      EXPECT_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
      DEPLOY_ENV: ${{ github.event.client_payload.environment || 'manual' }}
      DEPLOY_BRANCH: ${{ github.event.client_payload.git.ref || '' }}
      SMOKE_TARGET: deploy
      # Значення — лише з GitHub Secrets; скрипт додає заголовок x-vercel-protection-bypass і не друкує секрет.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Секрет обходу — лише на деплої нашого проєкту в нашому scope Vercel (адреси preview і гілок:
      # school-purchasing-<…>-kate-bdb7.vercel.app) і лише по https. Адреса з події чи поля url, що не відповідає
      # шаблону, перевіряється без заголовка (знахідка CodeRabbit у #93: client_payload.url — дані події, не довіра).
      SMOKE_BYPASS_HOST_PATTERN: '^school-purchasing-[a-z0-9-]+-kate-bdb7\.vercel\.app$'
      EVENT_NAME: ${{ github.event_name }}
    steps:
      # repository_dispatch завжди бере останній коміт main — нам звідти потрібен лише scripts/smoke.mjs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Що перевіряємо
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=smoke::Немає адреси деплою (client_payload.url чи поле url ручного запуску)"
            exit 1
          fi
          # Подія Vercel без коміту — аномалія: без sha smoke не звірить, що на адресі саме цей деплой (знахідка
          # CodeRabbit у #93). Ручний запуск без sha дозволено.
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -z "$EXPECT_SHA" ]; then
            echo "::error title=smoke::Подія deployment.success без client_payload.git.sha — коміт деплою не можна звірити"
            exit 1
          fi
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::warning title=smoke::Немає секрету VERCEL_AUTOMATION_BYPASS_SECRET — захищений деплой відповість стіною входу Vercel."
          fi
          echo "Середовище: $DEPLOY_ENV; гілка: ${DEPLOY_BRANCH:-?}; коміт: ${EXPECT_SHA:0:7}"
      - name: Деплой відкривається з обходом захисту, база відповідає, коміт той самий
        run: node scripts/smoke.mjs "$DEPLOY_URL" "$EXPECT_SHA"
      - name: Алерт людині в Telegram (лише якщо щось червоне)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ENV: ${{ github.event.client_payload.environment || 'manual' }}
          ALERT_BRANCH: ${{ github.event.client_payload.git.ref || '' }}
          ALERT_URL: ${{ github.event.client_payload.url || inputs.url }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_JOB: ${{ github.job }}
          ALERT_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Без set -x і без curl -v: токен бота стоїть в адресі запиту. Значення секретів не друкуємо ніде.
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning title=alert::Немає секретів TELEGRAM_BOT_TOKEN і/або TELEGRAM_CHAT_ID — алерт пропущено (smoke однаково червоний)."
            exit 0
          fi
          host=$(printf '%s' "$ALERT_URL" | sed -E 's#^[A-Za-z]+://##; s#/.*$##')
          text=$(printf 'ЧЕРВОНИЙ SMOKE\nРепо: %s\nWorkflow: %s, job: %s\nСередовище: %s%s\nАдреса: %s\nКоміт: %s\nПрогін: %s' \
            "$GITHUB_REPOSITORY" "$ALERT_WORKFLOW" "$ALERT_JOB" "$ALERT_ENV" "${ALERT_BRANCH:+ (гілка $ALERT_BRANCH)}" \
            "${host:-не задано}" "${ALERT_SHA:0:7}" "$RUN_URL")
          if curl -sS --fail --max-time 15 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}" 2>/dev/null; then
            echo "Алерт надіслано в Telegram."
          else
            echo "::warning title=alert::Telegram не прийняв повідомлення — перевірте токен бота, chat id і чи бот доданий у чат."
          fi
